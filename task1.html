<!DOCTYPE html>

  <main>
    <h1>Task 1: HTML5 Validation</h1>
    <p>All fields are required. Name: maximum 50 characters. Message: maximum 500 characters.</p>
    <form class="simple-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required maxlength="50">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required maxlength="500"></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
