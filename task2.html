<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Bootstrap Form Styling</title>
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav aria-label="Tasks">
    <a href="task0.html">Task 0</a>
    <a href="task1.html">Task 1</a>
    <a href="task2.html" class="active" aria-current="page">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html">Task 4</a>
  </nav>
  <main>
    <h1>Task 2: Bootstrap Form Styling</h1>
    <p>All fields are required.</p>
    <form>
    <div class="row">
      <div class="col-md-6">
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" type="text" id="name" name="name" required maxlength="50" autocomplete="name" placeholder="Enter your name">
    </div>
      </div>
      <div class="col-md-6">
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com" aria-describedby="email-help">
      <div id="email-help" class="form-text">Use a valid email address.</div>
    </div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="message">Message</label>
      <textarea class="form-control" id="message" name="message" rows="4" required maxlength="500" placeholder="Enter your message" aria-describedby="message-help"></textarea>
      <div id="message-help" class="form-text">Maximum 500 characters.</div>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </main>
</body>
</html>
